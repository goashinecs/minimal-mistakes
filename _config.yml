# ----------------------------------
# Site Settings
# ----------------------------------

title: "Goa Shine Blog"
title_separator: "-"
name: "Goa Shine Cleaning Services"
description: "Cleaning tips, services, and guides in Goa."
locale: "en-US"
url: "https://blog.goashinecs.com"  # Set to your subdomain
baseurl: ""                         # Leave blank if not in a subfolder
repository: "your-username/your-repo"  # Optional: GitHub repo link

minimal_mistakes_skin: "default"
breadcrumbs: true
words_per_minute: 200
enable_copy_code_button: true

# ----------------------------------
# SEO Verification (Optional)
# ----------------------------------
google_site_verification: "your-code"
bing_site_verification: "your-code"

# ----------------------------------
# Author Information
# ----------------------------------

author:
  name: "Goa Shine Team"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "We provide expert cleaning services and tips in Goa."
  location: "Goa, India"
  email: "contact@goashinecs.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:contact@goashinecs.com"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.goashinecs.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/your-username"

# ----------------------------------
# Social Sharing
# ----------------------------------

twitter:
  username: "goashinecs"
facebook:
  username: "goashinecs"
og_image: "/assets/images/og-image.jpg"

# ----------------------------------
# Plugins
# ----------------------------------

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# ----------------------------------
# Sitemap & Feed
# ----------------------------------

atom_feed:
  path: feed.xml
  hide: false

# ----------------------------------
# Output Settings
# ----------------------------------

permalink: /:categories/:title/
timezone: Asia/Kolkata
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ----------------------------------
# Pagination
# ----------------------------------

paginate: 5
paginate_path: /page:num/

pagination:
  enabled: true
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true
  trail:
    before: 2
    after: 2

# ----------------------------------
# Defaults (Canonical URLs & Layouts)
# ----------------------------------

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      canonical_url: "{{ site.url }}{{ page.url }}"
  - scope:
      path: ""
      type: pages
    values:
      canonical_url: "{{ site.url }}{{ page.url }}"

# ----------------------------------
# Markdown
# ----------------------------------

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ----------------------------------
# SCSS/SASS
# ----------------------------------

sass:
  sass_dir: _sass
  style: compressed

# ----------------------------------
# Compress HTML
# ----------------------------------

compress_html:
  clippings: all
  ignore:
    envs: development

# ----------------------------------
# Include/Exclude Files
# ----------------------------------

include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - Rakefile
  - test
  - docs
  - tmp

keep_files:
  - .git
  - .svn

# ----------------------------------
# Archives (Optional)
# ----------------------------------

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
